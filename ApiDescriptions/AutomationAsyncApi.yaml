asyncapi: 2.6.0
info:
  title: Automation Service
  version: "1.0.0"
  description: |
    Automation Service listens to device telemetry and status events,
    evaluates automation rules, and publishes commands and automation events.

defaultContentType: application/json

servers:
  kafka-broker:
    url: kafka:9092
    protocol: kafka

channels:

  device.events:
    description: Device lifecycle events (online/offline, state updates)
    subscribe:
      message:
        $ref: "#/components/messages/DeviceEvent"

  telemetry.raw:
    description: Raw telemetry from all devices
    subscribe:
      message:
        $ref: "#/components/messages/TelemetryMessage"

  automation.commands:
    description: Commands generated by automation rules
    publish:
      message:
        $ref: "#/components/messages/DeviceCommand"

  automation.events:
    description: Logs of automation rule triggers
    publish:
      message:
        $ref: "#/components/messages/AutomationEvent"


components:

  messages:

    DeviceEvent:
      name: DeviceEvent
      payload:
        type: object
        properties:
          deviceId:
            type: string
            format: uuid
          eventType:
            type: string
            enum: [online, offline, state_changed]
          timestamp:
            type: string
            format: date-time
          state:
            type: object
            nullable: true

    TelemetryMessage:
      name: TelemetryMessage
      payload:
        type: object
        properties:
          deviceId:
            type: string
            format: uuid
          metric:
            type: string
          value:
            type: number
            nullable: true
          json_data:
            type: object
            nullable: true
          timestamp:
            type: string
            format: date-time

    DeviceCommand:
      name: DeviceCommand
      payload:
        type: object
        properties:
          commandId:
            type: string
            format: uuid
          deviceId:
            type: string
            format: uuid
          command:
            type: string
          payload:
            type: object
          source:
            type: string
            enum: [automation, user]
          createdAt:
            type: string
            format: date-time

    AutomationEvent:
      name: AutomationEvent
      payload:
        type: object
        properties:
          eventId:
            type: string
            format: uuid
          ruleId:
            type: string
            format: uuid
          deviceId:
            type: string
            format: uuid
          eventType:
            type: string
            enum: [rule_triggered, rule_failed]
          message:
            type: string
          timestamp:
            type: string
            format: date-time